[package]
name = "pixelkit"
version = "0.4.1"
edition = "2024"
rust-version = "1.88"
description = "A lightweight Linux color picker, code scanner, magnifier, and screen ruler"
license = "MIT"
repository = "https://github.com/Kuucheen/PixelKit"
readme = "README.md"
keywords = ["color-picker", "barcode-scanner", "screen-ruler", "wayland", "x11"]
categories = ["gui", "multimedia::images"]

[dependencies]
anyhow = "1.0"
arboard = { version = "3.6", default-features = false, features = ["wayland-data-control"] }
# Keep ashpd and AccessKit on zbus's async-io backend. zbus 5.18 selects its
# Tokio backend whenever Cargo unifies both runtime features, but AccessKit's
# worker is not running inside a Tokio runtime and consequently panics at
# startup. PixelKit can still poll ashpd's runtime-independent futures from its
# own Tokio runtimes. `documents` also activates ashpd's serde-repr dependency,
# which its 0.13 screenshot feature uses for the portal target flags.
ashpd = { version = "0.13", default-features = false, features = ["async-io", "documents", "global_shortcuts", "open_uri", "screenshot"] }
directories = "6.0"
eframe = { version = "=0.33.3", default-features = false, features = ["accesskit", "default_fonts", "glow", "wayland", "x11"] }
futures-util = "0.3"
global-hotkey = "0.8"
image = { version = "0.25", default-features = false, features = ["png"] }
percent-encoding = "2.3"
rxing = { version = "0.9.2", default-features = false, features = ["decoders", "encoding_rs", "full_barcode_format_support", "multi_barcode_readers"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1.48", features = ["macros", "rt-multi-thread", "signal", "time"] }
x11rb = { version = "0.14", features = ["randr"] }

[dev-dependencies]
# Production only links the decoder. Tests enable writers so they can generate
# deterministic QR/barcode fixtures in memory.
rxing = { version = "0.9.2", default-features = false, features = ["encoders"] }

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = "s"
panic = "abort"
strip = "symbols"

[package.metadata.deb]
maintainer = "PixelKit contributors <70746714+Kuucheen@users.noreply.github.com>"
copyright = "2026, PixelKit contributors"
license-file = ["LICENSE", "4"]
extended-description = "Native Linux color picker, QR and barcode scanner, configurable magnifier, color editor, and screen ruler workflows."
depends = "$auto, libc6, libgcc-s1, libgl1, libx11-6, libxcb1, libxkbcommon0, libwayland-client0"
recommends = "xdg-desktop-portal, xdg-desktop-portal-gtk | xdg-desktop-portal-kde | xdg-desktop-portal-gnome"
section = "graphics"
priority = "optional"
assets = [
  ["target/release/pixelkit", "usr/bin/", "755"],
  ["packaging/linux/io.github.Kuucheen.PixelKit.desktop", "usr/share/applications/", "644"],
  ["packaging/linux/io.github.Kuucheen.PixelKit.metainfo.xml", "usr/share/metainfo/", "644"],
  ["packaging/linux/io.github.Kuucheen.PixelKit.svg", "usr/share/icons/hicolor/scalable/apps/", "644"],
  ["packaging/linux/io.github.Kuucheen.PixelKit.png", "usr/share/icons/hicolor/128x128/apps/", "644"],
  ["packaging/linux/512x512/io.github.Kuucheen.PixelKit.png", "usr/share/icons/hicolor/512x512/apps/", "644"],
  ["packaging/linux/pixelkit.service", "usr/lib/systemd/user/", "644"],
  ["docs/pixelkit.1", "usr/share/man/man1/", "644"],
  ["NOTICE", "usr/share/doc/pixelkit/NOTICE", "644"],
  ["LICENSES/Apache-2.0.txt", "usr/share/licenses/pixelkit/Apache-2.0.txt", "644"],
]
